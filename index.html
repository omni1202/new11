<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네온 디지털 시계</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 15%, rgba(244, 63, 94, 0.28), transparent 34%),
          radial-gradient(circle at 80% 20%, rgba(34, 211, 238, 0.34), transparent 37%),
          radial-gradient(circle at 40% 85%, rgba(168, 85, 247, 0.26), transparent 38%),
          linear-gradient(140deg, #030712 0%, #020617 50%, #0f172a 100%);
        font-family: "Orbitron", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.04) 0,
          rgba(255, 255, 255, 0.04) 1px,
          transparent 2px,
          transparent 4px
        );
        opacity: 0.16;
        pointer-events: none;
      }

      .clock-wrap {
        position: relative;
        padding: 1.5rem;
      }

      .clock-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 24px;
        background: radial-gradient(circle, rgba(45, 212, 191, 0.28), rgba(3, 7, 18, 0));
        filter: blur(24px);
        transform: scale(1.1);
        z-index: -1;
      }

      .clock {
        display: inline-block;
        padding: 2rem 3rem;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(145deg, rgba(6, 12, 30, 0.75), rgba(2, 6, 23, 0.25));
        backdrop-filter: blur(6px);
        font-size: clamp(3.5rem, 13vw, 9rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        color: #67e8f9;
        text-shadow:
          0 0 12px rgba(103, 232, 249, 1),
          0 0 28px rgba(34, 211, 238, 0.95),
          0 0 55px rgba(34, 211, 238, 0.85),
          0 0 90px rgba(236, 72, 153, 0.7);
        box-shadow:
          inset 0 0 22px rgba(34, 211, 238, 0.28),
          inset 0 0 58px rgba(236, 72, 153, 0.25),
          0 0 50px rgba(34, 211, 238, 0.42),
          0 0 100px rgba(236, 72, 153, 0.3);
      }

      @media (max-width: 640px) {
        .clock {
          padding: 1.4rem 1.6rem;
          letter-spacing: 0.08em;
        }
      }
    </style>
  </head>
  <body>
    <div class="clock-wrap">
      <time id="clock" class="clock" aria-live="polite"></time>
    </div>

    <script>
      const clock = document.querySelector('#clock');

      function renderClock() {
        const now = new Date();
        const timeText = now.toLocaleTimeString('ko-KR', {
          hour12: false,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });

        clock.textContent = timeText;
        clock.dateTime = now.toISOString();
      }

      renderClock();
      setInterval(renderClock, 1000);
    </script>
  </body>
</html>
