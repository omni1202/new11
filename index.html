<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대한민국 공휴일 캘린더</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-glow page-glow-left"></div>
    <div class="page-glow page-glow-right"></div>

    <main class="app-shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">KOREA HOLIDAY TRACKER</p>
          <h1>대한민국 공휴일 캘린더</h1>
          <p class="hero-text">
            한국 공휴일을 한눈에 보고, 다가오는 공휴일을 바로 확인할 수 있는
            캘린더입니다.
          </p>
        </div>

        <div class="status-card">
          <p class="status-label">대한민국 기준 오늘</p>
          <p class="status-date" id="today-label">-</p>
          <p class="status-time" id="live-time">00:00:00</p>
          <p class="status-note" id="range-label">지원 연도 불러오는 중</p>
        </div>
      </section>

      <section class="highlight-grid">
        <article class="countdown-panel">
          <div class="panel-head">
            <p class="panel-kicker">가장 가까운 공휴일</p>
            <span class="day-badge" id="countdown-badge">-</span>
          </div>

          <h2 id="countdown-title">공휴일 계산 중</h2>
          <p class="countdown-date" id="countdown-date">-</p>
          <p class="countdown-note" id="countdown-note">
            한국 시간 기준으로 가장 가까운 공휴일을 찾고 있습니다.
          </p>
        </article>

        <article class="mini-panel">
          <p class="panel-kicker">다가오는 공휴일</p>
          <h2 id="followup-title">다음 공휴일을 준비 중</h2>
          <p class="mini-stat" id="remaining-holiday-count">
            올해 남은 공휴일을 계산하고 있습니다.
          </p>
        </article>
      </section>

      <section class="controls-card">
        <div class="controls-left">
          <p class="panel-kicker">달력 보기</p>
          <h2 id="month-heading">-</h2>
        </div>

        <div class="controls-right">
          <button class="nav-button" id="prev-month" type="button">
            이전
          </button>
          <select id="year-select" aria-label="연도 선택"></select>
          <button class="nav-button" id="next-month" type="button">
            다음
          </button>
        </div>
      </section>

      <section class="content-grid">
        <article class="calendar-card">
          <div class="calendar-weekdays" id="weekday-row"></div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </article>

        <aside class="list-card">
          <div class="list-head">
            <p class="panel-kicker">연도별 공휴일</p>
            <h2 id="holiday-list-heading">-</h2>
          </div>
          <div class="holiday-list" id="holiday-list"></div>
        </aside>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
